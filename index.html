button{font-family:inherit;border:none;cursor:pointer;border-radius:999px;min-height:48px;min-width:48px;font-size:16px;font-weight:700;transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;}

.progress{margin-bottom:10px;font-size:20px;letter-spacing:2px;}
.progress-num{font-size:13px;color:var(--pink-strong);opacity:.8;margin-bottom:14px;}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}

<script>
const app = document.getElementById('stage');
const floaterLayer = document.getElementById('floaters');

function spawnFloater(){
  const el=document.createElement('div');el.className='floater';
  const emojis=['❤️','💗','✨','🌸'];
  el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.fontSize=(14+Math.random()*16)+'px';
  el.style.setProperty('--drift',(Math.random()*80-40)+'px');
  el.style.animationDuration=(6+Math.random()*6)+'s';
  floaterLayer.appendChild(el);
  setTimeout(()=>el.remove(),13000);
}
setInterval(spawnFloater,900);

function burstHearts(x,y,count=10){
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='floater';
    el.textContent=Math.random()>.5?'❤️':'✨';
    el.style.left=(x+(Math.random()*60-30))+'px';
    el.style.bottom=(window.innerHeight-y)+'px';
    el.style.fontSize=(12+Math.random()*14)+'px';
    el.style.setProperty('--drift',(Math.random()*100-50)+'px');
    el.style.animationDuration=(2+Math.random()*1.5)+'s';
    floaterLayer.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

function render(html,onMount){
  app.classList.add('leaving');
  setTimeout(()=>{
    app.innerHTML=html;
    app.classList.remove('leaving');
    if(onMount) onMount();
  },220);
}

const cuteChars=['🐰','🐱','🦋','🌸','🐣'];
let qIndex=0, noAttempts=0;

function landing(){
  render(`
    <div class="big-heart">❤️</div>
    <div class="cute-char">🥺</div>
    <h2>Leena...</h2>

    <p>জানি... কিন্তু একটা ছোট্ট কথা ছিল। ❤️</p>
    <button class="btn-primary" id="enterBtn">একটু কথা বলবে? 🥺</button>
  `,()=>{
    document.getElementById('enterBtn').onclick=(e)=>{
      burstHearts(e.clientX,e.clientY,12);
      qIndex=0;noAttempts=0;
      renderQuestion();
    };
  });
}

function heartsProgress(i){let s='';for(let k=0;k<questions.length;k++){s+=k<=i?'❤️':'🤍';}return s;}

function renderQuestion(){

      <div class="progress">${heartsProgress(qIndex)}</div>
      <div class="progress-num">${qIndex+1} / ${questions.length}</div>
      <div class="cute-char">${cuteChars[qIndex%cuteChars.length]}</div>
      <div class="q-text">${item.q}</div>
      <div class="response" id="responseText"></div>
      <div class="qa-row" id="qaRow">
        <button class="btn-yes" id="yesBtn">হ্যাঁ ❤️</button>
        <button class="btn-no" id="noBtn">না</button>
      </div>
    </div>
  `;
  render(card,()=>{
    noAttempts=0;
    const respEl=document.getElementById('responseText');
    const yesBtn=document.getElementById('yesBtn');
    const noBtn=document.getElementById('noBtn');
    yesBtn.onclick=(e)=>{
      burstHearts(e.clientX,e.clientY,16);
      yesBtn.disabled=true;noBtn.disabled=true;noBtn.classList.add('disabled');
      let lines=item.yes.slice(),i=0;
      function showNext(){
        if(i<lines.length){
          respEl.textContent=lines[i];i++;
          setTimeout(showNext,1300);
        }else{
          setTimeout(()=>{
            qIndex++;
            if(qIndex<questions.length){renderQuestion();}
            else{pinkTransition();}
          },900);
        }
      }
      showNext();
    };
    noBtn.onclick=()=>{
      if(noAttempts>=5)return;
      respEl.textContent=item.no[noAttempts];
      noAttempts++;
      if(noAttempts>=5){
        noBtn.classList.add('disabled');
        setTimeout(()=>{respEl.textContent=item.after;},1200);
      }
    };
  });
}

function pinkTransition(){
  const overlay=document.createElement('div');
  overlay.className='pink-screen';
  overlay.innerHTML=`<div class="msg" id="pinkMsg"></div>`;
  document.body.appendChild(overlay);
  const msgEl=overlay.querySelector('#pinkMsg');
  setTimeout(()=>{
    msgEl.textContent="একটা ছোট্ট surprise এখনও বাকি... ❤️";
    setTimeout(()=>{
      msgEl.textContent="তুমি কি সেটা দেখতে চাও?";
      setTimeout(()=>{
        const isTouch='ontouchstart' in window;
        msgEl.textContent=isTouch?"Tap anywhere...":"Click anywhere...";
      },1600);
    },1400);
  },1200);
  overlay.onclick=()=>{overlay.remove();treeScene();};
}

function heartPath(cx,cy,s){
  return `M ${cx} ${cy+s*0.3} C ${cx-s} ${cy-s*0.6}, ${cx-s*1.6} ${cy+s*0.5}, ${cx} ${cy+s*1.4} C ${cx+s*1.6} ${cy+s*0.5}, ${cx+s} ${cy-s*0.6}, ${cx} ${cy+s*0.3} Z`;
}

function buildTreeSVG(){
  const hearts=[];
  const rows=[
    {y:170,xs:[430,470,530,570]},
    {y:210,xs:[380,420,460,500,540,580,620]},
    {y:250,xs:[350,395,435,475,515,555,595,640]},
    {y:290,xs:[340,385,425,465,505,545,585,625,660]},
    {y:330,xs:[350,395,435,475,515,555,595,635]},
    {y:370,xs:[380,420,460,500,540,580,620]},
    {y:405,xs:[420,460,500,540,580]},
    {y:435,xs:[460,500,540]},
  ];
  let seed=11;
  function rand(){seed=(seed*9301+49297)%233280;return seed/233280;}
  rows.forEach(row=>{
    row.xs.forEach(x=>{
      const jitterX=(rand()-0.5)*14, jitterY=(rand()-0.5)*10;
      const size=14+rand()*8, rot=(rand()-0.5)*30;
      const shade=['#FF3D81','#E91E63','#FF8FB8','#D81B60'][Math.floor(rand()*4)];
      hearts.push({x:x+jitterX,y:row.y+jitterY,s:size,rot,shade});
    });
  });
  const heartEls=hearts.map(h=>`<path d="${heartPath(h.x,h.y,h.s)}" fill="${h.shade}" opacity="0" transform="rotate(${h.rot} ${h.x} ${h.y})" class="leaf"/>`).join('');
  return `
  <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="500" cy="620" rx="260" ry="18" fill="#FF8FB8" opacity="0.25"/>
    <g id="roots" fill="none" stroke="#B0003A" stroke-width="6" stroke-linecap="round">
      <path class="rootline" d="M500 600 Q 430 615 380 630" stroke-dasharray="140" stroke-dashoffset="140"/>
      <path class="rootline" d="M500 600 Q 500 620 500 640" stroke-dasharray="140" stroke-dashoffset="140"/>
      <path class="rootline" d="M500 600 Q 570 615 620 630" stroke-dasharray="140" stroke-dashoffset="140"/>
    </g>
    <path id="trunk" d="M500 600 C 495 520, 505 470, 500 420" fill="none" stroke="#B0003A" stroke-width="16" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"/>
    <g id="branches" fill="none" stroke="#B0003A" stroke-width="9" stroke-linecap="round">
      <path class="branch" d="M500 460 C 440 430, 400 380, 360 330" stroke-dasharray="160" stroke-dashoffset="160"/>
      <path class="branch" d="M500 440 C 560 400, 600 350, 640 300" stroke-dasharray="160" stroke-dashoffset="160"/>
      <path class="branch" d="M500 420 C 480 370, 480 330, 500 280" stroke-dasharray="160" stroke-dashoffset="160"/>
      <path class="branch" d="M500 460 C 450 440, 410 420, 380 400" stroke-dasharray="120" stroke-dashoffset="120"/>
      <path class="branch" d="M500 440 C 550 420, 590 400, 620 385" stroke-dasharray="120" stroke-dashoffset="120"/>
    </g>
    <g id="canopy">${heartEls}</g>
  </svg>`;
}

function treeScene(){
  render(`
    <div class="tree-stage">
      <div class="tree-visual">${buildTreeSVG()}</div>
      <div class="tree-copy"><p id="treeMsg">কিছু অভিমান...</p></div>
    </div>
  `,()=>{
    const svg=document.querySelector('.tree-visual svg');
    const treeMsg=document.getElementById('treeMsg');
    const roots=svg.querySelectorAll('.rootline');
    const trunk=svg.querySelector('#trunk');
    const branches=svg.querySelectorAll('.branch');
    const leaves=svg.querySelectorAll('.leaf');
    function setMsg(t){
      treeMsg.style.animation='none';void treeMsg.offsetWidth;
      treeMsg.style.animation='riseIn .6s ease both';
      treeMsg.textContent=t;
    }
    setTimeout(()=>{
      roots.forEach(r=>{r.style.transition='stroke-dashoffset 1.2s ease';r.style.strokeDashoffset='0';});
      setMsg("...একদিনে ভাঙে না।");
    },600);
    setTimeout(()=>{
      trunk.style.transition='stroke-dashoffset 1.4s ease';trunk.style.strokeDashoffset='0';
      setMsg("সময় লাগে...");
    },1900);
    setTimeout(()=>{
      branches.forEach((b,i)=>{setTimeout(()=>{b.style.transition='stroke-dashoffset 1s ease';b.style.strokeDashoffset='0';},i*150);});
      setMsg("বোঝাপড়া লাগে...");
    },3400);
    setTimeout(()=>{
      setMsg("আর একটু ভালোবাসা লাগে। ❤️");
      leaves.forEach((l,i)=>{setTimeout(()=>{l.style.transition='opacity .5s ease, transform .5s ease';l.style.opacity='1';},i*18);});
    },5000);
    setTimeout(()=>{treeMessages();},5000+leaves.length*18+900);
  });
}

function confettiBurst(){
  const layer=document.createElement('div');layer.className='confetti';
  document.body.appendChild(layer);
  const colors=['#FF3D81','#FF8FB8','#E91E63','#FFD6E7','#B0003A'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');p.className='piece';
    const isHeart=Math.random()>0.5;
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(2.5+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*1.2)+'s';
    if(isHeart){p.textContent='❤️';p.style.fontSize=(12+Math.random()*10)+'px';}
    else{p.style.width='8px';p.style.height='14px';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.borderRadius='2px';}
    layer.appendChild(p);
  }
  setTimeout(()=>layer.remove(),5000);
}
